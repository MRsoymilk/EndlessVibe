# EXAMPLE ONLY: create workspace roots with:
#   endlessvibe --init --workspace projects=/home/user/projects
# Then stop the service and mount projects with:
#   endlessvibe --add-project projects:my-project=/home/user/projects/my-project
# Environment variables and '~' are NOT expanded inside TOML paths.
[server]
bind = "0.0.0.0:20000"
public_url = "https://mcp.example.com"
allowed_hosts = ["localhost", "127.0.0.1", "host.docker.internal", "endlessvibe"]

[security]
data_dir = "/home/user/.local/state/endlessvibe"
allow_http_loopback = false
extra_redirect_uris = []
access_token_seconds = 3600
refresh_token_seconds = 2592000

[limits]
max_file_bytes = 2097152
max_read_bytes = 262144
max_output_bytes = 1048576
command_timeout_seconds = 120
max_jobs = 2
retained_jobs = 100
search_max_files = 5000
search_max_bytes = 67108864

[execution]
backend = "bubblewrap"
acknowledge_unsafe_host_execution = false
allow_shell = false
allow_network = false
auto_discover_toolchains = true
bubblewrap = "/usr/bin/bwrap"
path = "/usr/local/bin:/usr/bin:/bin"
allowed_programs = ["cargo", "rustc", "cmake", "ninja", "make", "ctest", "python3", "git", "rg"]
# Programs that must exist inside the sandbox even when they are only launched
# by child build/test scripts rather than directly through run_command.
required_programs = ["cargo", "rustc", "initdb", "postgres", "pg_isready", "createdb"]
readonly_mounts = []
memory_limit_mb = 8192
max_processes = 256

[git]
executable = "/usr/bin/git"
author_name = "EndlessVibe"
author_email = "endlessvibe@localhost"

[[workspaces]]
id = "projects"
path = "/home/user/projects"

[[workspaces.projects]]
id = "my-project"
path = "my-project"
allow_write = true
allow_exec = true
allow_git_commit = true
allow_git_mutation = false
allow_git_push = false
execution_profile = "development"
# Optional one-time Project environment. Values are not shown by Dashboard/API summaries.
# environment = ["TEST_DATABASE_URL=postgres://user:password@127.0.0.1:19031/test"]

[[workspaces.projects]]
id = "another-project"
path = "another-project"
allow_write = true
allow_exec = false
allow_git_commit = true
allow_git_mutation = false
allow_git_push = false
execution_profile = "isolated"

# Workspace roots are management boundaries. Project paths are relative to their
# workspace root and are the units used by file, command and Git tools.
